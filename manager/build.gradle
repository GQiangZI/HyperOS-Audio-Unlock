plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.qiangzi.hyperosaudiomanager'
    // Miuix 0.9.4 的 AAR 要求 compileSdk 至少 37（checkReleaseAarMetadata 会拦 36）
    // 只改 compileSdk，不改 targetSdk/minSdk：日志里也说了这三者可以分开改。
    compileSdk 37

    defaultConfig {
        applicationId 'com.qiangzi.hyperosaudiomanager'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-miuix'
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 9 内置 Kotlin：不要用 android.kotlinOptions，
    // jvmTarget 默认跟 compileOptions.targetCompatibility（Java 17）一致。

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    implementation 'androidx.activity:activity-compose:1.13.0'
}
