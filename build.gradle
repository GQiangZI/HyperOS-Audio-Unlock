plugins {
    id 'com.android.application' version '9.4.1' apply false
    // AGP 9 起内置 Kotlin，禁止再声明 org.jetbrains.kotlin.android，
    // 否则 AgpWithBuiltInKotlinAppliedCheck 会在配置阶段直接失败。
    // Compose 编译器插件不是 kotlin-android，可以保留，Kotlin 版本由它带到 2.4.20。
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.20' apply false
}
